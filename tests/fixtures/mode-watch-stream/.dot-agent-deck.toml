# Synthetic fixture for tabs/mode/006 (issue #367). One persistent side pane
# that keeps the DEFAULT `watch = true`, so the command is wrapped in
# `dot-agent-deck watch`, and whose command deliberately never exits.
#
# The sentinel is assembled at runtime (`printf 'WATCH_%s\n' STREAM_SENTINEL`)
# so the literal `WATCH_STREAM_SENTINEL` can NOT appear in the command line the
# pane's shell echoes. Seeing it on screen therefore proves the watch wrapper
# streamed real output from a still-running command, rather than the test
# matching its own echoed configuration.
[[modes]]
name = "stream"
reactive_panes = 0

[[modes.panes]]
command = "printf 'WATCH_%s\\n' STREAM_SENTINEL; sleep 600"
name = "Streaming sentinel"
