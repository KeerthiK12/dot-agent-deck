[package]
name = "xtask-linkage-check"
version = "0.0.0"
edition = "2024"
publish = false

# PRD #77 Decision 7: enforces the catalog↔test linkage and Decision 21's
# no-raw-sleep rule. Invoked as `cargo xtask linkage-check` via the
# alias defined in `.cargo/config.toml`.

[[bin]]
name = "xtask-linkage-check"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1"
regex = "1"
syn = { version = "3", features = ["full", "parsing"] }
xtask-docs = { path = "../docs" }

# Issue #461: `clean-e2e-tmp` decides by owning-PID liveness, which needs
# `kill(pid, 0)` — the only call that distinguishes "no such process" (ESRCH,
# dead) from "not yours" (EPERM, alive). `libc` is already a workspace
# dependency at the same version and gating (the root package declares it under
# `[target.'cfg(unix)'.dependencies]`), so this pulls no new crate into
# Cargo.lock. Unix-only: every `libc::` reference is behind `#[cfg(unix)]` and
# non-Unix targets fall back to the age rule.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
