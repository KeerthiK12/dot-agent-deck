name: Docs Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'GHCR image tag to publish (e.g. v0.26.0). Required when called by another workflow.'
        required: true
        type: string
      chart_version:
        description: 'If set, also update Chart.yaml version/appVersion (release path only).'
        required: false
        type: string
        default: ''
      push_latest:
        description: 'Also push :latest tag (release path only).'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Fail here, not at the "Commit chart changes" push. This job pushes the
      # chart bump straight to `main`, which only an admin identity may do:
      # `main` is ruleset-protected and `github-actions[bot]` is deliberately
      # NOT a bypass actor (GITHUB_TOKEN cannot be one on a user-owned repo).
      # RELEASE_TOKEN is the admin PAT that bypasses it.
      #
      # This step replaces a `|| github.token` fallback whose stated purpose --
      # keeping the workflow unchanged "while the secret is unset, so this
      # change is safe to merge before `main` is protected" -- expired when
      # `main` was protected on 2026-08-08. All it can do now is downgrade a
      # missing secret to an identity that cannot push.
      #
      # This workflow is reached two ways and BOTH need the secret in scope:
      # `workflow_dispatch` (where it is), and release.yml's `docs` job via
      # `uses:`, which passes it only because that call sets `secrets:
      # inherit`. Dropping that line is how v0.35.9's docs job died at "Commit
      # chart changes" with the image already published but `main`'s chart
      # pointer stale -- fixed in 428acef. A guard here catches that class of
      # mistake at step 1 of the callee instead.
      - name: Verify RELEASE_TOKEN is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is unset or empty. This job pushes the chart bump to the protected \`main\` branch and needs the admin PAT to bypass the ruleset; GITHUB_TOKEN cannot. If this run was triggered by release.yml, check that its \`docs\` job still passes \`secrets: inherit\`. See CLAUDE.md rule 8."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            ORIGIN="workflow_call"
          else
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            TAG="main-${SHORT_SHA}"
            ORIGIN="manual"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"

      - name: Compose tag list
        id: tags
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "ghcr.io/vfarcic/dot-agent-deck-docs:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm values
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' site/helm/values.yaml

      - name: Update Chart.yaml (release path only)
        if: inputs.chart_version != ''
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          yq -i '.version = strenv(CHART_VERSION)' site/helm/Chart.yaml
          yq -i '.appVersion = "v" + strenv(CHART_VERSION)' site/helm/Chart.yaml

      - name: Commit chart changes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ORIGIN: ${{ steps.tag.outputs.origin }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sync local main to remote before re-applying our changes so the
          # push at the end fast-forwards cleanly even if main advanced
          # between checkout and this step (e.g. the release workflow's
          # changelog commit pushed in the finalize job).
          git stash --include-untracked || true
          git checkout main
          git pull --rebase --autostash origin main
          git stash pop || true
          git add site/helm/Chart.yaml site/helm/values.yaml
          if git diff --cached --quiet; then
            echo "No chart changes to commit"
            exit 0
          fi
          if [ "${ORIGIN}" = "manual" ]; then
            MSG="chore: publish docs image ${TAG} [skip ci]"
          else
            MSG="chore: update docs chart to ${TAG} [skip ci]"
          fi
          git commit -m "$MSG"
          git push origin main

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          ORIGIN: ${{ steps.tag.outputs.origin }}
        run: |
          {
            echo "## Docs publish"
            echo ""
            echo "- **Image**: \`ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}\`"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "- **Also tagged**: \`:latest\`"
            fi
            echo "- **Trigger**: ${ORIGIN}"
          } >> "$GITHUB_STEP_SUMMARY"
